name: Buscar imóveis

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar a busca
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: web_unlocker1
        run: node scripts/buscar.mjs

      - name: Salvar resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imoveis.json historico/ radar-memoria.json lista-negra.json
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza imoveis.json [automático]"
            git fetch origin main
            git rebase origin/main || (
              echo "🔁 Conflito detectado. Mantendo versão recém-gerada..."
              git checkout --ours -- imoveis.json historico/*.json radar-memoria.json lista-negra.json
              git add imoveis.json historico/*.json radar-memoria.json lista-negra.json
              git rebase --continue
            )
            git push
          else
            echo "Nada mudou em imoveis.json, nada para salvar."
          fi
