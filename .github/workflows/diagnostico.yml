name: Diagnóstico de Chaves

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar diagnóstico
        env:
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          echo "============================================================"
          echo "🔍 DIAGNÓSTICO DE VARIÁVEIS DE AMBIENTE"
          echo "============================================================"
          echo ""
          echo "📋 VERIFICANDO CHAVES:"
          echo ""
          echo "  HASDATA_API_KEY: ${HASDATA_API_KEY:+"✅"} ${HASDATA_API_KEY:-"❌ VAZIO"}"
          echo "  BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:+"✅"} ${BRIGHTDATA_API_KEY:-"❌ VAZIO"}"
          echo ""
          echo "============================================================"
